schema_version: "1.2.0"
profile: intel-arc-b580-12gb-reference
gpu:
  vendor: Intel
  family: Arc B-Series
  model: B580
  vram_gb: 12
  memory_type: GDDR6
  memory_bandwidth_gbps: 456
  peak_int8_tops: 233
  matrix_engines: XMX
  llm_acceleration_apis:
    - vulkan
  preferred_llm_acceleration_order:
    - vulkan
cpu_reference:
  model: AMD Ryzen 7 7700
  cores: 8
  threads: 16
  tdp_w: 65
system_memory_reference_gb: 48
policy:
  preferred_mode: local_fast
  local_fast_target: compact_quantized_models
  local_deep_allowed: true
  llm_acceleration: vulkan
  backend_choice_locked: true
  context_requires_qualification: true
  vulkan_models_max: 1
  vulkan_gpu_layers: auto
  vulkan_context_tokens_initial: 8192
  vulkan_requires_openclaw_e2e: true
  automatic_backend_promotion: false
  rollback_backend: ollama-vulkan
notes:
  - "Le profil décrit une cible de qualification, pas une garantie de débit."
  - "Vulkan est l'unique API d'accélération LLM supportée par le projet sur Intel Arc B580."
  - "Ollama/Vulkan est le chemin nominal et llama.cpp/Vulkan le runtime géré utilisé par le profil B580 hybride."
  - "Un seul modèle llama.cpp est chargé à la fois pour respecter les 12 Go de VRAM et 48 Go de RAM système."
  - "Les modèles dépassant la VRAM utilisent l'auto-fit llama.cpp; forcer gpu-layers=all désactive l'ajustement automatique."
