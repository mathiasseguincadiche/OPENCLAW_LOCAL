schema_version: "1.0.0"
platform_version: "0.2.0"

security_defaults:
  profile: coding
  fs_workspace_only: true
  exec_mode: ask
  elevated_enabled: false
  cloud_tools_without_explicit_escalation: false

agents:
  chef-operations:
    profile: coding
    deny: [write, edit, apply_patch, exec, process]

  expert-recherche:
    profile: coding
    also_allow: [browser]
    deny: [write, edit, apply_patch, exec, process]

  architecte-solutions:
    profile: coding
    deny: [exec, process]
    write_scope: [context, diagrams]

  ingenieur-devops:
    profile: coding
    deny: []

  ingenieur-securite:
    profile: coding
    deny: [write, edit, apply_patch]

  ingenieur-release-forges:
    profile: coding
    deny: []

  redacteur-technique:
    profile: coding
    deny: [exec, process]

  auditeur-qualite:
    profile: coding
    deny: [write, edit, apply_patch, exec, process]

notes:
  - "Le profil coding inclut group:web : web_search et web_fetch restent disponibles localement."
  - "Seul expert-recherche reçoit browser par défaut pour les sites JS complexes."
  - "Les outils de fichiers restent bornés au workspace de chaque agent."
  - "Toute commande exec hors allowlist requiert une approbation humaine avec exec_mode=ask."
  - "Le mode elevated reste désactivé."
  - "Ingénieur sécurité audite et scanne mais ne modifie pas directement les sources."
  - "Architecte solutions peut produire ADR et schémas sans disposer d'exec/process."
  - "Les rôles de revue ne peuvent pas modifier silencieusement le livrable qu'ils auditent."
