schema_version: "1.1.0"
platform_version: "0.2.0"
backends:
  ollama-vulkan:
    provider: ollama
    mode: nominal
    windows_native: true
    endpoint: "http://127.0.0.1:11434"
    activation: automatic
    accelerator: vulkan
    qualification_required: true

  llama-cpp-sycl:
    provider: llama_cpp_http
    provider_id: intel-sycl
    mode: candidate
    windows_native: true
    endpoint: "http://127.0.0.1:8080/v1"
    api: openai-completions
    accelerator: sycl
    device_api: level_zero
    device: SYCL0
    activation: managed_candidate
    runtime_lock: llama_cpp_sycl
    router:
      models_max: 1
      autoload: true
      offline: true
      jinja: true
      gpu_layers: all
      context_tokens: 8192
    model_source: ollama_gguf_blobs
    qualification_required: true
    promotion_requires:
      - intel_arc_b580_detected
      - sycl_device_detected
      - level_zero_device_detected
      - all_three_models_load
      - benchmark_vs_ollama
      - openclaw_http_provider_smoke
      - tool_calling_e2e
      - three_stable_runs
      - human_review

  llama-cpp-vulkan:
    provider: llama_cpp_http
    mode: candidate
    windows_native: true
    endpoint: "http://127.0.0.1:8080/v1"
    api: openai-completions
    accelerator: vulkan
    activation: operator_managed
    qualification_required: true

selection:
  default_backend: ollama-vulkan
  production_backend_requires_b580_benchmark: true
  compare_same_model_when_possible: true
  no_automatic_promotion: true
  rollback_backend: ollama-vulkan
  metrics:
    - ttft_ms
    - tokens_per_second
    - prompt_tokens_per_second
    - vram_mb
    - ram_mb
    - model_load_ms
    - stability
    - tool_calling
    - model_switch_ms
