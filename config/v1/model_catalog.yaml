schema_version: "1.2.0"
platform_version: "0.2.0"
policy:
  local_first: true
  local_model_count: 3
  performance_only: true
  only_supported_local_aliases: [qwen-max, gemma-deep, devstral-devops]
  no_hidden_small_model_fallback: true
  hardware_qualification_required_before_performance_claims: true

models:
  qwen-max:
    provider: ollama
    runtime_id: qwen3.8:27b
    sycl_runtime_id: qwen3.8:27B
    family: qwen
    class: local_max
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [orchestration, research, security, release, deep_reasoning]
    context_policy: benchmark_before_raise

  gemma-deep:
    provider: ollama
    runtime_id: gemma4:26b
    sycl_runtime_id: gemma4:26B
    family: gemma
    class: local_deep
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [architecture, documentation, independent_review, multimodal_review]
    context_policy: benchmark_before_raise

  devstral-devops:
    provider: ollama
    runtime_id: devstral-small-2:24b
    sycl_runtime_id: devstral-small-2:24B
    family: mistral
    class: local_specialist
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [devops, software_engineering, repository_tools, multi_file_editing]
    context_policy: benchmark_before_raise

cloud_catalog:
  research:
    provider: openrouter
    runtime_id: perplexity/sonar-pro-search
    enabled: false
    purpose: fresh_research_only
  frontier-reasoning:
    provider: openrouter
    runtime_id: openai/gpt-5.6-sol
    enabled: false
    purpose: exceptional_frontier_reasoning
  frontier-review:
    provider: openrouter
    runtime_id: anthropic/claude-sonnet-5
    enabled: false
    purpose: exceptional_independent_review
