schema_version: "1.6.0"
platform_version: "0.2.0"
policy:
  local_first: true
  local_model_count: 3
  performance_only: true
  only_supported_local_aliases: [qwen-max, gemma-deep, devstral-devops]
  no_hidden_small_model_fallback: true
  hardware_qualification_required_before_performance_claims: true
  target_hardware_profile: intel_arc_b580_12gb
  nominal_context_tokens: 8192
  openclaw_agent_context_tokens: 16384
  openclaw_agent_context_is_benchmark_promotion: false
  extended_context_requires_qualification: true

models:
  qwen-max:
    provider: ollama
    runtime_id: qwen3.5:9b-q4_K_M
    sycl_runtime_id: qwen3.5:9b-q4_K_M
    vulkan_runtime_id: qwen3.5:9b-q4_K_M
    family: qwen
    class: local_max
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [orchestration, research, security, release, deep_reasoning]
    quantization: Q4_K_M
    registry_size_gb: 6.6
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192, 16384]
    hardware_fit: unqualified_b580_12gb_candidate
    context_policy: benchmark_before_raise

  gemma-deep:
    provider: ollama
    runtime_id: gemma4:12b-it-q4_K_M
    sycl_runtime_id: gemma4:12b-it-q4_K_M
    vulkan_runtime_id: gemma4:12b-it-q4_K_M
    family: gemma4
    class: local_deep
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [architecture, documentation, independent_review, multimodal_review, deep_reasoning]
    quantization: Q4_K_M
    registry_size_gb: 7.6
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192, 16384]
    hardware_fit: unqualified_b580_12gb_candidate
    context_policy: benchmark_before_raise

  devstral-devops:
    provider: ollama
    runtime_id: hf.co/mistralai/Ministral-3-14B-Reasoning-2512-GGUF:Q4_K_M
    sycl_runtime_id: hf.co/mistralai/Ministral-3-14B-Reasoning-2512-GGUF:Q4_K_M
    vulkan_runtime_id: hf.co/mistralai/Ministral-3-14B-Reasoning-2512-GGUF:Q4_K_M
    family: mistral3-reasoning
    class: local_specialist
    input: [text]
    required: true
    status: candidate
    routing_active: true
    purpose: [devops, software_engineering, repository_tools, multi_file_editing, deep_reasoning]
    quantization: Q4_K_M
    registry_size_gb: 8.24
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192, 16384]
    hardware_fit: unqualified_b580_12gb_candidate
    compatibility_alias: true
    compatibility_note: "Alias logique historique conservé pour ne pas casser les routes/workspaces; runtime désormais le GGUF officiel Ministral 3 14B Reasoning Q4_K_M servi par Ollama depuis Hugging Face."
    multimodal_handoff: [qwen-max, gemma-deep]
    context_policy: benchmark_before_raise

benchmark_challengers:
  granite-agentic:
    provider: ollama
    runtime_id: granite4.2:8b-q4_K_M
    family: granite4
    class: benchmark_challenger
    input: [text]
    required_for_selection: true
    status: candidate_challenger
    routing_active: false
    incumbent_alias: devstral-devops
    challenge_scope: [native_tool_calling, tool_feedback_repair, devops_quality, b580_fit]
    quantization: Q4_K_M
    registry_size_gb: 5.3
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192]
    hardware_fit: unqualified_b580_12gb_challenger
    automatic_promotion: false
    compatibility_note: "Granite 4.2 8B Q4_K_M est un challenger de benchmark uniquement; il ne compte pas dans les trois modèles routés et ne peut devenir nominal sans preuve B580 et décision humaine explicite."

cloud_catalog:
  research:
    provider: openrouter
    runtime_id: perplexity/sonar-pro-search
    enabled: false
    purpose: fresh_research_only
  frontier-reasoning:
    provider: openrouter
    runtime_id: openai/gpt-5.6-sol
    enabled: false
    purpose: exceptional_frontier_reasoning
  frontier-review:
    provider: openrouter
    runtime_id: anthropic/claude-sonnet-5
    enabled: false
    purpose: exceptional_independent_review
