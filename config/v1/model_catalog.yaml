schema_version: "1.5.0"
platform_version: "0.2.0"
policy:
  local_first: true
  local_model_count: 3
  performance_only: true
  only_supported_local_aliases: [qwen-max, gemma-deep, devstral-devops]
  no_hidden_small_model_fallback: true
  hardware_qualification_required_before_performance_claims: true
  target_hardware_profile: intel_arc_b580_12gb
  nominal_context_tokens: 8192
  openclaw_agent_context_tokens: 16384
  openclaw_agent_context_is_benchmark_promotion: false
  extended_context_requires_qualification: true

models:
  qwen-max:
    provider: ollama
    runtime_id: qwen3.5:9b-q4_K_M
    sycl_runtime_id: qwen3.5:9b-q4_K_M
    vulkan_runtime_id: qwen3.5:9b-q4_K_M
    family: qwen
    class: local_max
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [orchestration, research, security, release, deep_reasoning]
    quantization: Q4_K_M
    registry_size_gb: 6.6
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192, 16384]
    hardware_fit: unqualified_b580_12gb_candidate
    context_policy: benchmark_before_raise

  gemma-deep:
    provider: ollama
    runtime_id: gemma3:12b-it-q4_K_M
    sycl_runtime_id: gemma3:12b-it-q4_K_M
    vulkan_runtime_id: gemma3:12b-it-q4_K_M
    family: gemma
    class: local_deep
    input: [text, image]
    required: true
    status: candidate
    routing_active: true
    purpose: [architecture, documentation, independent_review, multimodal_review]
    quantization: Q4_K_M
    registry_size_gb: 8.1
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192, 16384]
    hardware_fit: unqualified_b580_12gb_candidate
    context_policy: benchmark_before_raise

  devstral-devops:
    provider: ollama
    runtime_id: qwen2.5-coder:14b-instruct-q4_K_M
    sycl_runtime_id: qwen2.5-coder:14b-instruct-q4_K_M
    vulkan_runtime_id: qwen2.5-coder:14b-instruct-q4_K_M
    family: qwen2-coder
    class: local_specialist
    input: [text]
    required: true
    status: candidate
    routing_active: true
    purpose: [devops, software_engineering, repository_tools, multi_file_editing]
    quantization: Q4_K_M
    registry_size_gb: 9.0
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192, 16384]
    hardware_fit: unqualified_b580_12gb_candidate
    compatibility_alias: true
    compatibility_note: "Alias logique historique conservé pour ne pas casser les routes/workspaces; runtime désormais Qwen2.5 Coder 14B."
    multimodal_handoff: [qwen-max, gemma-deep]
    context_policy: benchmark_before_raise

benchmark_challengers:
  ministral-tool-calling:
    provider: ollama
    runtime_id: ministral-3:14b-instruct-2512-q4_K_M
    family: mistral
    class: benchmark_challenger
    input: [text, image]
    required_for_selection: true
    status: candidate_challenger
    routing_active: false
    incumbent_alias: gemma-deep
    challenge_scope: [native_tool_calling, tool_feedback_repair, architecture_quality, b580_fit]
    quantization: Q4_K_M
    registry_size_gb: 9.1
    nominal_context_tokens: 8192
    qualification_context_tokens: [8192]
    hardware_fit: unqualified_b580_12gb_challenger
    automatic_promotion: false
    compatibility_note: "Challenger de benchmark uniquement; ne compte pas dans la flotte locale routée et ne peut pas devenir nominal sans décision humaine explicite."

cloud_catalog:
  research:
    provider: openrouter
    runtime_id: perplexity/sonar-pro-search
    enabled: false
    purpose: fresh_research_only
  frontier-reasoning:
    provider: openrouter
    runtime_id: openai/gpt-5.6-sol
    enabled: false
    purpose: exceptional_frontier_reasoning
  frontier-review:
    provider: openrouter
    runtime_id: anthropic/claude-sonnet-5
    enabled: false
    purpose: exceptional_independent_review
