name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-python:
    name: Release / Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Validate repository
        run: python scripts/21_validate_repository.py
      - name: Validate configuration
        run: python scripts/22_validate_configs.py
      - name: Validate SemVer tag
        run: python scripts/24_validate_release.py --tag "${GITHUB_REF_NAME}"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      - name: Build package
        run: python -m build
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  validate-windows:
    name: Release / PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PowerShell quality modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $targets = @('.\menu.ps1', '.\scripts\windows', '.\tests\powershell')
          $findings = foreach ($target in $targets) {
            Invoke-ScriptAnalyzer -Path $target -Recurse `
              -Settings '.\.github\powershell\PSScriptAnalyzerSettings.psd1'
          }
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer a détecté $(@($findings).Count) anomalie(s)."
          }
      - name: Pester
        shell: pwsh
        run: Invoke-Pester -Path '.\tests\powershell' -CI -Output Detailed

  publish:
    name: Publish GitHub release
    needs: [validate-python, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
