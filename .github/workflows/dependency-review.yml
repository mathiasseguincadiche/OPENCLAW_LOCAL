name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect GitHub Dependency Graph
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph n'est pas encore activé; fallback pip-audit utilisé."
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
      - name: Set up Python fallback
        if: steps.dependency-graph.outputs.enabled != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit installed Python dependencies
        if: steps.dependency-graph.outputs.enabled != 'true'
        run: |
          python -m pip install -e . pip-audit
          pip-audit --local --skip-editable
