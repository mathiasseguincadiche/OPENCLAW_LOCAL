name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repository contracts
        run: python scripts/21_validate_repository.py
      - name: Configuration contracts
        run: python scripts/22_validate_configs.py
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and expose docs action
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | Format-List; exit 1 }
          }
          .\menu.ps1 -Action docs
